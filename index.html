<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Quest – Tikshuv CCNA</title>
<style>
:root{
  --bg:#0b1020;--panel:#141b34;--panel2:#1c2547;--ink:#e8ecff;--mute:#8d97c4;
  --cyan:#35e0ff;--green:#3dffa0;--pink:#ff4fd8;--gold:#ffd23d;--red:#ff5470;--line:#2a3566;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1b2a66 0%,transparent 60%),var(--bg)}
#app{max-width:860px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0}
h1{font-size:2rem;letter-spacing:.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 6px 24px #0006}
.mute{color:var(--mute)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:linear-gradient(180deg,#2b3a7a,#222d63);border:1px solid #3d4d96;border-radius:12px;padding:10px 18px;font-weight:700;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--cyan)}
.btn.go{background:linear-gradient(180deg,#1fcf8a,#14a06a);border-color:#47ffb5;color:#032015}
.btn.warn{background:linear-gradient(180deg,#ff6a86,#d63a5c);border-color:#ff9db0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.big{font-size:1.15rem;padding:14px 26px}
.logo{font-size:4rem}
.glow{text-shadow:0 0 18px var(--cyan)}
input[type=text]{font:inherit;background:#0d1330;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;max-width:280px;text-align:center}

/* top HUD */
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-weight:700}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem}
.bar{height:10px;background:#0d1330;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .15s linear}
.bar.low>i{background:linear-gradient(90deg,var(--red),var(--gold))}

/* question */
.flavor{color:var(--cyan);font-size:.9rem;font-weight:600}
.prompt{font-size:1.25rem;margin:6px 0}
.source{font-size:2.6rem;font-weight:800;font-family:ui-monospace,Consolas,monospace;color:var(--gold);text-shadow:0 0 14px #ffd23d66;margin:4px 0}
.source small{font-size:1rem;color:var(--mute)}

/* THE POWER TABLE */
.tblwrap{background:#0d1330;border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.tbl{display:flex;justify-content:center;gap:14px}
.grp{display:flex;gap:4px;flex:1;max-width:400px}
.grp.locked{opacity:.22}
.col{flex:1;text-align:center;min-width:0}
.exp{font-size:.8rem;color:var(--mute);font-family:ui-monospace,monospace}
.val{font-size:1.2rem;font-weight:800;color:var(--cyan);margin:2px 0 6px}
.bit{width:100%;aspect-ratio:1;max-height:64px;border-radius:10px;border:2px solid var(--line);background:#101845;font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;color:#5b679f;transition:.12s}
.bit.on{background:linear-gradient(180deg,#3dffa0,#18b873);border-color:#9bffd0;color:#02281a;box-shadow:0 0 16px #3dffa088}
.bit.fixed{cursor:default}
.bit.bad{outline:3px solid var(--red)}
.bit.hinted{box-shadow:0 0 0 3px var(--gold),0 0 16px #ffd23d88}
.bit:disabled{cursor:default}
.nibs{display:flex;justify-content:center;gap:14px;margin-top:8px}
.nib{flex:1;max-width:400px;text-align:center;font-family:ui-monospace,monospace;font-weight:700;color:var(--gold);min-height:1.4em;font-size:.95rem}
.readout{text-align:center;margin-top:8px;font-family:ui-monospace,monospace;font-size:1.05rem;color:var(--green)}
.hexchart{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.hexchart div{background:var(--panel2);border-radius:8px;text-align:center;padding:3px 0;font-size:.8rem;font-family:ui-monospace,monospace}
.hexchart b{display:block;color:var(--gold);font-size:1rem}

/* keypad */
.ans{font-family:ui-monospace,monospace;font-size:2rem;text-align:center;min-height:2.6rem;background:#0d1330;border:2px dashed var(--line);border-radius:12px;padding:4px 10px;margin:10px auto;max-width:320px;color:var(--gold);letter-spacing:3px}
.pad{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:460px;margin:0 auto}
.pad.dec{grid-template-columns:repeat(5,1fr)}
.pad button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-weight:700;font-family:ui-monospace,monospace;font-size:1.1rem}
.pad button:hover{border-color:var(--cyan)}

/* power-ups */
.pw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pw button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.85rem;font-weight:700}
.pw button:disabled{opacity:.35}
.pw button.armed{border-color:var(--gold);box-shadow:0 0 12px #ffd23d88}
.pw span{display:block;font-size:1.3rem}

/* feedback */
.fb{border-radius:14px;padding:14px;margin-top:12px;border:2px solid}
.fb.ok{background:#0e3a2a;border-color:var(--green)}
.fb.no{background:#3a1220;border-color:var(--red)}
.fb code{background:#0006;padding:2px 6px;border-radius:6px;color:var(--gold)}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.lv.locked{opacity:.45}
.lv .ic{font-size:2rem}
.stars{color:var(--gold);letter-spacing:2px}
.tag{font-size:.75rem;color:var(--mute)}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#241a00;font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;box-shadow:0 6px 20px #0008;animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.conf{position:fixed;top:-30px;font-size:1.6rem;z-index:15;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cert{border:3px double var(--gold);background:linear-gradient(135deg,#1c2547,#141b34);text-align:center;padding:26px}
@media(max-width:520px){.source{font-size:2rem}.val{font-size:1rem}.bit{font-size:1.1rem}.tbl,.nibs{gap:6px}.grp{gap:2px}}
@media print{body{background:#fff}#app>*:not(.cert){display:none}.cert{color:#000;background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const POW = [128,64,32,16,8,4,2,1];
const bitsOf = v => POW.map(p => (v & p) ? 1 : 0);
const valOf = b => b.reduce((a,x,i) => a + x*POW[i], 0);
const hx = (v,n=1) => v.toString(16).toUpperCase().padStart(n,'0');
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const MASKS = [128,192,224,240,248,252,254,255];

/* ============================ sound ============================ */
let AC=null, muted=false;
function beep(f,d=.12,type='sine',when=0){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime+when; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx = {
  tap:()=>beep(520,.05,'square'),
  ok:()=>{beep(660,.1);beep(880,.15,'sine',.1)},
  no:()=>{beep(220,.25,'sawtooth')},
  pw:()=>{beep(500,.08);beep(750,.08,'sine',.08);beep(1000,.12,'sine',.16)},
  win:()=>[523,659,784,1046].forEach((f,i)=>beep(f,.2,'triangle',i*.12))
};

/* ============================ levels ============================ */
const LEVELS = [
 { name:"Bit Camp", icon:"🏕️", bits:4, min:1, max:15, types:['D2B','B2D'], time:60, thr:700, training:true,
   story:"Tikshuv Academy's network just went DARK! Zero-Day Zed, the Glitch Virus, scrambled every packet. Byte the Router Bot hands you the <b>Power Table</b>: every column is worth <b>double</b> the one on its right. Switch a column ON (1) to count it. Start in Bit Camp with just the right 4 columns: 8 · 4 · 2 · 1.",
   win:"Camp cleared! Your first packets are repaired. Byte beeps happily: “Now you know how the Power Table works!”",
   flavors:["A tiny packet is crying for help!","Zed scrambled a mini-message!","Repair this 4-bit packet!"] },
 { name:"Byte Bay", icon:"⚓", bits:8, min:1, max:63, types:['D2B','B2D'], time:60, thr:750, training:true,
   story:"The tide brings full BYTES: 8 columns, from 128 down to 1 (that's 2⁷ down to 2⁰). The big columns on the left are still sleeping in these small numbers, keep them OFF unless you need them!",
   win:"The bay is safe. Zed's pirate bots are retreating!",
   flavors:["A byte washed ashore…","Decode the message in the bottle!","Zed's pirates left this byte behind!"] },
 { name:"Full Byte Fortress", icon:"🏰", bits:8, min:1, max:255, types:['D2B','B2D'], time:50, thr:800, training:false,
   story:"The Fortress guards numbers up to <b>255</b> (all 8 lights ON). The training wheels are OFF: no more live counter. Work it out from the table yourself. Tip: start from the biggest column and ask “does it fit?”",
   win:"The Fortress gates open! You can now read any byte from 0 to 255.",
   flavors:["Gatekeeper packet incoming!","Zed forged this packet, crack it!","Only the right byte opens this door!"] },
 { name:"Hex Harbor", icon:"🔷", bits:4, min:0, max:15, types:['B2H','H2B','D2H','H2D'], time:50, thr:850, training:true, hexchart:true,
   story:"New language alert! <b>Hexadecimal</b> counts to 15 with ONE digit: 0-9 then <b>A=10, B=11, C=12, D=13, E=14, F=15</b>. One hex digit = one 4-bit nibble (8 · 4 · 2 · 1). The Hex Chart is on your side. Use it!",
   win:"The harbor sings in hex! Every nibble is now one clean digit.",
   flavors:["Hex crate arrived at the dock!","A, B, C… which crate is this?","Zed mixed up the hex labels!"] },
 { name:"Hex Hills", icon:"⛰️", bits:8, min:0, max:255, types:['B2H','H2B'], time:50, thr:900, training:false, hexchart:true,
   story:"Climb the hills: a full byte is exactly <b>TWO hex digits</b>. Split the 8 columns into two nibbles (left 4, right 4), read each nibble 0–15, and write each as one hex digit. The Hex Chart still helps, but the live counter is gone.",
   win:"You reached the summit! Binary ⇄ Hex is now your superpower.",
   flavors:["Split it into two nibbles!","Left nibble first, then right!","Zed hid a hex byte up here!"] },
 { name:"Mix-Master Maze", icon:"🌀", bits:8, min:0, max:255, types:['D2B','B2D','B2H','H2B','D2H','H2D'], time:45, thr:950, training:false,
   story:"The Maze mixes EVERYTHING: decimal, binary and hex, in any direction. No chart, no counter. When converting decimal ⇄ hex, use the table as your <b>scratchpad</b> (it's interactive!): go through binary in the middle.",
   win:"You escaped the Maze! Decimal, binary and hex are all in your pocket.",
   flavors:["Which way out? Convert to find out!","Zed built a wall of numbers!","The maze whispers a number…"] },
 { name:"CCNA Core: Zed's Lair", icon:"🛰️", bits:8, types:['D2B','B2D','B2H','H2B','D2H','H2D'], time:40, thr:1000, training:false, ccna:true,
   story:"FINAL BOSS! Zed hides in the core router. To beat him you must speak <b>real CCNA</b>: IP address octets (192.168.1.<i>x</i>), subnet-mask octets (255.255.<b>240</b>.0) and MAC-address bytes in hex. Fix the core and Tikshuv's network is saved!",
   win:"ZED IS DELETED! The network is back online and Tikshuv Academy is safe. You are a true network hero!",
   flavors:[] }
];
const NQ = 10, NEED_CORRECT = 7, START_LIVES = 4;

/* ============================ save ============================ */
const KEY='binquest.v1';
let S = { name:'', unlocked:0, stars:[], best:[] };
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const totalScore = () => S.best.reduce((a,b)=>a+(b||0),0);
const totalStars = () => S.stars.reduce((a,b)=>a+(b||0),0);
const rank = () => { const s=totalStars(); return s>=20?'🏆 CCNA Grand Master':s>=15?'🥇 Network Engineer':s>=9?'🥈 Network Technician':'🥉 Network Cadet'; };

/* ============================ UI utils ============================ */
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
function confetti(){ const em=['🎉','⭐','💾','🔌','✨','🛰️','🟢']; for(let i=0;i<40;i++){ const s=document.createElement('div'); s.className='conf'; s.textContent=pick(em); s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(2+Math.random()*2.5)+'s'; s.style.animationDelay=Math.random()*.6+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),5500);} }
const app = () => $('#app');
const muteBtn = () => `<button class="pill" onclick="toggleMute()" id="mb">${muted?'🔇':'🔊'}</button>`;
function toggleMute(){ muted=!muted; const b=$('#mb'); if(b) b.textContent=muted?'🔇':'🔊'; }

/* ============================ THE POWER TABLE ============================ */
// T = state of the interactive table
let T = { bits:Array(8).fill(0), fixed:false, locked:0, hint:new Set(), bad:new Set(), readout:false, onChange:null };
function drawTable(){
  const grp = (from) => `<div class="grp ${from===0&&T.locked>0?'locked':''}">` + POW.slice(from,from+4).map((p,k)=>{
    const i=from+k, isLocked = i < T.locked, on=T.bits[i];
    return `<div class="col"><div class="exp">2<sup>${7-i}</sup></div><div class="val">${p}</div>
      <button class="bit ${on?'on':''} ${T.fixed||isLocked?'fixed':''} ${T.hint.has(i)?'hinted':''} ${T.bad.has(i)?'bad':''}" data-bit="${i}" ${T.fixed||isLocked?'disabled':''}>${on}</button></div>`;
  }).join('') + `</div>`;
  const hi=T.bits.slice(0,4), lo=T.bits.slice(4);
  const nib = a => T.readout ? '= '+hx(valOf([0,0,0,0,...a]))+'' : '';
  const nibD = a => T.readout ? valOf([0,0,0,0,...a]) : '';
  const v = valOf(T.bits);
  $('#tbl').innerHTML = `<div class="tbl">${grp(0)}${grp(4)}</div>` +
    (T.readout ? `<div class="nibs"><div class="nib">${T.locked>0?'':'nibble '+nibD(hi)+' → hex '+hx(valOf([0,0,0,0,...hi]))}</div><div class="nib">nibble ${nibD(lo)} → hex ${hx(valOf([0,0,0,0,...lo]))}</div></div>
      <div class="readout">Decimal: <b>${v}</b> &nbsp;|&nbsp; Hex: <b>0x${hx(v,T.locked>0?1:2)}</b></div>` : '');
}
function toggleBit(i){
  if(T.fixed || i < T.locked) return;
  T.bits[i] ^= 1; sfx.tap(); drawTable(); if(T.onChange) T.onChange();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-bit]'); if(b && $('#tbl') && $('#tbl').contains(b)) toggleBit(+b.dataset.bit);
});

/* ============================ SCREENS ============================ */
let G=null, timer=null;
function stopTimer(){ clearInterval(timer); timer=null; }

function home(){
  stopTimer();
  app().innerHTML = `
  <div class="card center">
    <div class="row between"><span></span>${muteBtn()}</div>
    <div class="logo">🤖💾</div>
    <h1 class="glow">BINARY QUEST</h1>
    <div class="mute">Rescue the Tikshuv Academy network · CCNA Edition</div>
    <p style="max-width:560px;margin:14px auto">Master <b>Binary</b>, <b>Decimal</b> and <b>Hexadecimal</b> using the <b>Power Table</b> (2⁰ → 2⁷). No formulas, just columns, lights and logic.</p>
    <p><input id="nm" type="text" placeholder="Your name, Cadet" maxlength="20" value="${(S.name||'').replace(/"/g,'&quot;')}"></p>
    <div class="row" style="justify-content:center">
      <button class="btn go big" onclick="startGame()">${S.unlocked>0||totalScore()>0?'▶ Continue':'▶ Start the Mission'}</button>
      <button class="btn" onclick="lab()">🧪 Training Lab</button>
    </div>
  </div>`;
}
function startGame(){ const n=$('#nm'); if(n) S.name=n.value.trim()||'Cadet'; save(); mapScreen(); }

function lab(){
  stopTimer();
  T = { bits:Array(8).fill(0), fixed:false, locked:0, hint:new Set(), bad:new Set(), readout:true, onChange:null };
  app().innerHTML = `
  <div class="card">
    <div class="row between"><h2>🧪 Training Lab</h2><button class="btn" onclick="home()">⬅ Back</button></div>
    <p><b>How the Power Table works</b></p>
    <ol>
      <li>Each column has a value. Going <b>left</b>, every column is <b>double</b> the one on its right: 1, 2, 4, 8, 16, 32, 64, 128.</li>
      <li>A <b>1</b> means the column is <b>ON</b> (counted). A <b>0</b> means OFF (ignored).</li>
      <li>The number is everything that is ON, added together. Try it below!</li>
      <li><b>Hex:</b> cut the 8 columns into two nibbles of 4. Each nibble (0–15) is ONE hex digit: 0-9, then A=10, B=11, C=12, D=13, E=14, F=15.</li>
    </ol>
    <div class="tblwrap" id="tbl"></div>
    <div class="hexchart">${[...Array(16).keys()].map(n=>`<div>${n}<b>${hx(n)}</b></div>`).join('')}</div>
    <p class="mute">Tip: the top number is decimal, the gold letter is hex. Switch lights and watch both change.</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="T.bits.fill(0);drawTable()">Reset</button><button class="btn go" onclick="startGame()">Ready! To the map ▶</button></div>
  </div>`;
  drawTable();
}

function mapScreen(){
  stopTimer();
  const done = S.stars.filter(Boolean).length;
  app().innerHTML = `
  <div class="card">
    <div class="row between"><div><h2>🗺️ Mission Map</h2><span class="mute">${S.name||'Cadet'} · ${rank()}</span></div>
      <div class="row"><span class="pill">⭐ ${totalStars()}/21</span><span class="pill">🏅 ${totalScore()}</span>${muteBtn()}</div></div>
    <div class="map">${LEVELS.map((L,i)=>{
      const open = i <= S.unlocked;
      return `<div class="lv ${open?'':'locked'}">
        <div class="ic">${open?L.icon:'🔒'}</div><b>Level ${i+1}: ${L.name}</b>
        <div class="stars">${'★'.repeat(S.stars[i]||0)}${'☆'.repeat(3-(S.stars[i]||0))}</div>
        <div class="tag">Pass: ${NEED_CORRECT}/${NQ} correct + ${L.thr} pts${S.best[i]?` · best ${S.best[i]}`:''}</div>
        <p><button class="btn ${open?'go':''}" ${open?`onclick="intro(${i})"`:'disabled'}>${S.stars[i]?'Play again':'Play'}</button></p></div>`;
    }).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="lab()">🧪 Training Lab</button><button class="btn" onclick="home()">🏠 Home</button>
    ${done===7?`<button class="btn go" onclick="victory()">🎓 Certificate</button>`:''}</div>
  </div>`;
}

function intro(i){
  const L=LEVELS[i];
  app().innerHTML = `
  <div class="card center">
    <div class="logo">${L.icon}</div>
    <h2>Level ${i+1}: ${L.name}</h2>
    <p style="max-width:600px;margin:10px auto;text-align:left">🤖 <b>Byte:</b> ${L.story}</p>
    <div class="card" style="background:var(--panel2)">
      <b>Mission rules</b>
      <p class="mute" style="margin:6px 0">${NQ} packets · ❤️ ${START_LIVES} lives · need <b>${NEED_CORRECT}+ correct</b> AND <b>${L.thr}+ points</b><br>
      Quick answers & streaks give bonus points. Power-ups: 💡 Scanner · ❄️ Time Freeze · 🛡️ Shield · ⏭️ Skip · ✖️2 Double</p>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" onclick="mapScreen()">⬅ Map</button><button class="btn go big" onclick="play(${i})">Go! ▶</button></div>
  </div>`;
}

/* ============================ GAMEPLAY ============================ */
function play(i){
  const L=LEVELS[i];
  G = { i, L, n:0, correct:0, score:0, streak:0, best:0, lives:START_LIVES, answered:false, seen:new Set(),
        pw:{hint:2,freeze:1,shield:1,skip:1,x2:1}, ans:'', x2:false, hints:0, tl:0, tt:0, q:null };
  nextQ();
}
function genQ(){
  const L=G.L;
  for(let t=0;t<30;t++){
    const type=pick(L.types); let val, kind=null;
    if(L.ccna){ const r=Math.random(); if(r<.4){kind='mask';val=pick(MASKS)} else if(r<.7){kind='ip';val=rnd(1,255)} else {kind='mac';val=rnd(16,255)} }
    else val=rnd(L.min,L.max);
    const key=type+val; if(G.seen.has(key)) continue; G.seen.add(key);
    const flavor = kind==='mask' ? "🛡️ Subnet-mask octet: 255.255.<i>x</i>.0"
                 : kind==='ip'   ? "🌐 IP-address octet: 192.168.1.<i>x</i>"
                 : kind==='mac'  ? "🔌 MAC-address byte: AA:BB:<i>xx</i>"
                 : "📡 "+pick(L.flavors);
    return {type,val,flavor};
  }
  return {type:L.types[0],val:rnd(L.min||1,L.max||255),flavor:"📡 Packet!"};
}
function nextQ(){
  stopTimer();
  if(G.n>=NQ || G.lives<=0) return finish();
  const L=G.L, nd=L.bits/4;
  const q=genQ(); G.q=q; G.answered=false; G.ans=''; G.x2=false; G.hints=0;
  const fixedBits = q.type==='B2D'||q.type==='B2H';
  const setMode = q.type==='D2B'||q.type==='H2B';
  q.setMode=setMode; q.fixedBits=fixedBits; q.hexMode = q.type==='B2H'||q.type==='D2H';
  q.nd=nd;
  T = { bits: fixedBits ? bitsOf(q.val) : Array(8).fill(0), fixed:fixedBits, locked:8-L.bits, hint:new Set(), bad:new Set(),
        readout: L.training && !fixedBits && setMode, onChange:null };
  const src = {
    D2B:`<div class="prompt">Switch the lights to build this <b>decimal</b> number in <b>binary</b>:</div><div class="source">${q.val} <small>decimal</small></div>`,
    H2B:`<div class="prompt">Switch the lights to build this <b>hex</b> number in <b>binary</b>:</div><div class="source">0x${hx(q.val,nd)} <small>hex</small></div>`,
    B2D:`<div class="prompt">The table shows a <b>binary</b> number. Type it in <b>decimal</b>:</div>`,
    B2H:`<div class="prompt">The table shows a <b>binary</b> number. Type it in <b>hex</b>:</div>`,
    D2H:`<div class="prompt">Convert to <b>hex</b> (use the table as scratchpad!):</div><div class="source">${q.val} <small>decimal</small></div>`,
    H2D:`<div class="prompt">Convert to <b>decimal</b> (use the table as scratchpad!):</div><div class="source">0x${hx(q.val,nd)} <small>hex</small></div>`
  }[q.type];
  const hexAns = q.hexMode;
  const pad = setMode ? '' : `<div class="ans" id="ans"></div>
    <div class="pad ${hexAns?'':'dec'}">${(hexAns?'0123456789ABCDEF':'0123456789').split('').map(c=>`<button data-k="${c}">${c}</button>`).join('')}<button data-k="⌫">⌫</button></div>`;
  app().innerHTML = `
  <div class="card" id="qcard">
    <div class="hud">
      <span class="pill">${L.icon} L${G.i+1}</span><span class="pill">Packet ${G.n+1}/${NQ}</span>
      <span class="pill" id="hl">${hearts()}</span><span class="pill" id="hs">🏅 ${G.score}</span><span class="pill" id="hk">🔥 ${G.streak}</span>${muteBtn()}
    </div>
    <div class="bar" style="margin:10px 0" id="tbar"><i style="width:100%"></i></div>
    <div class="flavor">${q.flavor}</div>
    ${src}
    <div class="tblwrap" id="tbl"></div>
    ${L.hexchart?`<div class="hexchart">${[...Array(16).keys()].map(n=>`<div>${n}<b>${hx(n)}</b></div>`).join('')}</div>`:''}
    ${pad}
    ${setMode?`<div class="center" style="margin-top:12px"><button class="btn go big" id="sub">Check ✔</button></div>`:`<div class="center"><button class="btn go big" id="sub">Check ✔</button></div>`}
    <div class="pw" id="pw"></div>
    <div id="fb"></div>
  </div>`;
  drawTable(); drawPW();
  $('#sub').onclick = submit;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
  if(!setMode) drawAns();
  G.tt = G.tl = L.time;
  timer = setInterval(tick, 100);
}
const hearts = () => '❤️'.repeat(Math.max(0,G.lives)) + '🖤'.repeat(START_LIVES-Math.max(0,G.lives));
function tick(){
  if(G.answered) return;
  G.tl -= .1;
  const bar=$('#tbar'); if(!bar) return;
  bar.firstChild.style.width = Math.max(0,G.tl/G.tt*100)+'%';
  bar.classList.toggle('low', G.tl < 10);
  if(G.tl<=0) submit(true);
}
function key(k){
  if(G.answered) return;
  const q=G.q, max = q.hexMode ? q.nd : 3;
  if(k==='⌫') G.ans=G.ans.slice(0,-1); else if(G.ans.length<max) G.ans+=k;
  sfx.tap(); drawAns();
}
function drawAns(){ const e=$('#ans'); if(e) e.textContent = (G.q.hexMode&&G.ans?'0x':'') + (G.ans||'?'); }
document.addEventListener('keydown', e => {
  if(!G || !$('#qcard')) return;
  if(e.key==='Enter'){ e.preventDefault(); if(G.answered) nextQ(); else submit(); return; }
  if(G.answered || G.q.setMode) return;
  if(e.key==='Backspace') return key('⌫');
  const c=e.key.toUpperCase();
  if(c.length===1 && (G.q.hexMode?/[0-9A-F]/:/[0-9]/).test(c)) key(c);
});

/* power-ups */
const PW = {
  hint:{ic:'💡',nm:'Scanner'}, freeze:{ic:'❄️',nm:'Freeze +15s'}, shield:{ic:'🛡️',nm:'Shield (auto)'},
  skip:{ic:'⏭️',nm:'Skip'}, x2:{ic:'✖️2',nm:'Double pts'}
};
function drawPW(){
  const el=$('#pw'); if(!el) return;
  el.innerHTML = Object.keys(PW).map(k=>{
    const dis = G.answered || G.pw[k]<=0 || k==='shield';
    return `<button data-pw="${k}" class="${k==='x2'&&G.x2?'armed':''}" ${dis?'disabled':''}><span>${PW[k].ic}</span>${PW[k].nm} ×${G.pw[k]}</button>`;
  }).join('');
  el.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>usePW(b.dataset.pw));
}
function usePW(k){
  if(G.answered||G.pw[k]<=0) return;
  const q=G.q;
  if(k==='hint'){
    G.pw.hint--; G.hints++; sfx.pw();
    if(q.setMode){            // reveal next needed column (turn it ON)
      const t=bitsOf(q.val); const i=t.findIndex((b,j)=>b && !T.bits[j]);
      if(i>=0){ T.bits[i]=1; T.hint.add(i); } else toast("All needed lights are already ON!");
      drawTable();
    } else if(q.fixedBits){   // highlight the lit columns
      bitsOf(q.val).forEach((b,j)=>{ if(b) T.hint.add(j); }); drawTable();
      toast("Gold = columns that are ON. Add their values!");
    } else {                  // scratchpad: show the binary pattern
      T.bits = bitsOf(q.val); T.hint = new Set(T.bits.map((b,j)=>b?j:-1).filter(j=>j>=0)); T.readout=false; drawTable();
      toast("Scanner built the binary for you. Now convert!");
    }
  } else if(k==='freeze'){ G.pw.freeze--; G.tl+=15; G.tt=Math.max(G.tt,G.tl); sfx.pw(); toast("❄️ +15 seconds!"); }
  else if(k==='skip'){ G.pw.skip--; sfx.pw(); G.seen.add('x'); return nextQ(); }
  else if(k==='x2'){ G.pw.x2--; G.x2=true; sfx.pw(); toast("✖️2 armed: double points if correct!"); }
  drawPW();
}
function award(){
  const k=pick(['hint','freeze','shield','skip','x2']); G.pw[k]++; sfx.pw(); toast(`Streak reward: ${PW[k].ic} ${PW[k].nm}!`);
}

/* answering */
function explain(v,nd){
  const b=bitsOf(v), lit=POW.filter((p,i)=>b[i]), s=b.join('');
  const hi=s.slice(0,4), lo=s.slice(4);
  const hexTxt = nd===1 ? `<code>${lo}</code> = <b>${hx(v)}</b>` : `<code>${hi}</code> = ${hx(parseInt(hi,2))} and <code>${lo}</code> = ${hx(parseInt(lo,2))} → <b>0x${hx(v,2)}</b>`;
  const binTxt = nd===1 ? lo : hi+' '+lo;
  return `Columns ON: <b>${lit.length?lit.join(' + '):'none'}</b> = <b>${v}</b><br>Binary: <code>${binTxt}</code><br>Hex: ${hexTxt}`;
}
function submit(timeout){
  if(G.answered) return;
  const q=G.q; let ok=false;
  if(timeout!==true){
    if(q.setMode) ok = valOf(T.bits)===q.val;
    else { if(!G.ans) return toast("Type an answer first!"); ok = parseInt(G.ans, q.hexMode?16:10)===q.val; }
  }
  G.answered=true; G.n++; stopTimer();
  let msg='';
  if(q.setMode){ const t=bitsOf(q.val); T.bad=new Set(t.map((b,i)=>b!==T.bits[i]?i:-1).filter(i=>i>=0)); }
  if(ok){
    G.correct++; G.streak++; G.best=Math.max(G.best,G.streak);
    const tb=Math.round(50*Math.max(0,G.tl)/G.tt), sb=Math.min(50,G.streak*10), hp=40*G.hints;
    let pts=Math.max(20,100+tb+sb-hp); if(G.x2) pts*=2;
    G.score+=pts; sfx.ok();
    msg=`<div class="fb ok"><b>✅ Correct! +${pts} pts</b> <span class="mute">(speed +${tb}, streak +${sb}${hp?`, scanner −${hp}`:''}${G.x2?', ×2':''})</span><br>${explain(q.val,q.nd)}</div>`;
    if(G.streak%3===0) setTimeout(award,400);
  } else {
    G.streak=0;
    let saved=false;
    if(G.pw.shield>0){ G.pw.shield--; saved=true; } else G.lives--;
    sfx.no(); $('#qcard').classList.add('shake');
    msg=`<div class="fb no"><b>${timeout===true?'⏰ Time is up!':'❌ Not quite.'}</b> ${saved?'🛡️ Shield saved your life!':'You lost a life.'}<br>Right answer: <b>${q.hexMode?'0x'+hx(q.val,q.nd):q.type==='D2B'||q.type==='H2B'?'binary below':q.val}</b><br>${explain(q.val,q.nd)}</div>`;
  }
  // show the right pattern on the table
  const wrongSet=T.bad; T.bits=bitsOf(q.val); T.fixed=true; T.readout=false; T.hint=new Set(); T.bad=ok?new Set():wrongSet; drawTable();
  $('#hl').textContent=hearts(); $('#hs').textContent='🏅 '+G.score; $('#hk').textContent='🔥 '+G.streak;
  const last = G.n>=NQ || G.lives<=0;
  $('#fb').innerHTML = msg + `<div class="center" style="margin-top:10px"><button class="btn go big" id="nx">${last?'See results ▶':'Next ▶'}</button></div>`;
  $('#nx').onclick=nextQ; $('#sub').disabled=true; drawPW();
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* results */
function finish(){
  stopTimer();
  const L=G.L, i=G.i;
  const passed = G.lives>0 && G.correct>=NEED_CORRECT && G.score>=L.thr;
  const stars = !passed?0 : G.correct===NQ?3 : G.correct>=9?2 : 1;
  if(passed){
    S.stars[i]=Math.max(S.stars[i]||0,stars); S.best[i]=Math.max(S.best[i]||0,G.score);
    S.unlocked=Math.max(S.unlocked,Math.min(i+1,LEVELS.length-1)); save(); sfx.win(); confetti();
  }
  const why = passed ? '' : G.lives<=0 ? "Zed's virus broke through your firewall (all lives lost)."
    : G.correct<NEED_CORRECT ? `You need at least ${NEED_CORRECT} correct answers (you got ${G.correct}).`
    : `You need ${L.thr} points (you got ${G.score}). Answer faster and keep streaks going!`;
  const allDone = LEVELS.every((_,k)=>S.stars[k]);
  app().innerHTML = `
  <div class="card center">
    <div class="logo">${passed?'🎉':'💥'}</div>
    <h2>${passed?'Level Complete!':'Not this time…'}</h2>
    <div class="stars" style="font-size:2.2rem">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>${passed?`🤖 ${L.win}`:`🤖 ${why} Don't worry, every great engineer retries!`}</p>
    <div class="row" style="justify-content:center"><span class="pill">✅ ${G.correct}/${NQ}</span><span class="pill">🏅 ${G.score} / ${L.thr}</span><span class="pill">🔥 best streak ${G.best}</span></div>
    <p class="mute">3★ = perfect score (10/10) · 2★ = 9 correct · 1★ = pass</p>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="mapScreen()">🗺️ Map</button>
      <button class="btn ${passed?'':'go'}" onclick="intro(${i})">🔁 ${passed?'Replay':'Try again'}</button>
      ${passed&&i<LEVELS.length-1?`<button class="btn go big" onclick="intro(${i+1})">Next level ▶</button>`:''}
      ${passed&&allDone?`<button class="btn go big" onclick="victory()">🎓 Finish!</button>`:''}
    </div>
  </div>`;
}

function victory(){
  confetti(); sfx.win();
  app().innerHTML = `
  <div class="card cert">
    <div class="logo">🏆</div>
    <h1 class="glow">NETWORK RESTORED!</h1>
    <p>Zero-Day Zed is deleted and Tikshuv Academy's network is back online.</p>
    <p>This certifies that</p>
    <h2 style="font-size:2rem;color:var(--gold)">${(S.name||'Cadet').replace(/</g,'&lt;')}</h2>
    <p>has mastered Binary · Decimal · Hexadecimal with the Power Table</p>
    <p><b>${rank()}</b><br>⭐ ${totalStars()}/21 · 🏅 ${totalScore()} points</p>
    <p class="mute">Tikshuv · CCNA Preparation</p>
  </div>
  <div class="row" style="justify-content:center"><button class="btn" onclick="window.print()">🖨️ Print</button><button class="btn go" onclick="mapScreen()">🗺️ Map (get all 3★!)</button></div>`;
}

home();
</script>
</body>
</html>
